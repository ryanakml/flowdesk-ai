    <text x="70" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" fill="#111B21">Can I change the delivery address</text>
    <text x="70" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" fill="#111B21">for my order #FD-9281?</text>
    <text x="312" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#50645A">14:28 ✓✓</text>

    <!-- Message 2: Incoming Grounded AI Bubble -->
    <rect x="20" y="185" width="330" height="135" rx="14" fill="#FFFFFF"/>
    <text x="35" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" fill="#111B21">Done! Updated to 42 Orchard Rd.</text>
    <text x="35" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" fill="#111B21">We've verified your order and</text>
    <text x="35" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" fill="#111B21">emailed your confirmation.</text>

