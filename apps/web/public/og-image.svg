    <rect x="18" y="345" width="354" height="50" rx="12" fill="#1C2826" stroke="#33463F"/>
    <circle cx="36" cy="370" r="4.5" fill="#25D366"/>
    <text x="48" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#C8D7D2">Sarah M. is reviewing this thread</text>
    <text x="48" y="381" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#25D366">Heartbeat lock active · Zero collisions</text>

    <!-- SLA Metric Footer -->
    <text x="28" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#64737D">AVERAGE RESOLUTION TIME</text>
    <text x="28" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="14" fill="#E6FFDA">&lt; 45 seconds · 99.98% delivery rate</text>
