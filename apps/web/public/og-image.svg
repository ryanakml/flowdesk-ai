  <text x="80" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" letter-spacing="1.5" fill="#25D366">ENTERPRISE WHATSAPP AUTOMATION · OFFICIAL META CLOUD API</text>

  <!-- Editorial Headline (Weight 400) -->
  <text x="80" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="46" letter-spacing="-0.5" fill="#FFFFFF">Turn every customer message</text>
  <text x="80" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="46" letter-spacing="-0.5" fill="#FFFFFF">into a verified resolution.</text>

  <!-- Subtitle -->
  <text x="80" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="20" fill="#A0AAB2">Accelerate customer support with AI knowledge-grounded responses,</text>
  <text x="80" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="20" fill="#A0AAB2">multi-agent team inbox, and sovereign cryptographic isolation.</text>

  <!-- Capability Badges -->
  <g transform="translate(80, 480)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="168" height="34" rx="17" fill="#142026" stroke="#33463F"/>
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" fill="#E6FFDA">✓ Policy Grounded AI</text>
    <!-- Badge 2 -->
