    <circle cx="31" cy="31" r="3.5" fill="#25D366"/>
  </g>
  <text x="134" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="30" fill="#FFFFFF">FlowDesk</text>
