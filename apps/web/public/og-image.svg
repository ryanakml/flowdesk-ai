<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Night Canvas -->
  <rect width="1200" height="630" fill="#111B21"/>

  <!-- Ambient Emerald Radial Glow -->
  <circle cx="1020" cy="120" r="420" fill="#25D366" fill-opacity="0.07" filter="blur(90px)"/>

  <!-- Top-Left Brand Identity: Squircle + FlowDesk • -->
  <g transform="translate(80, 70)">
